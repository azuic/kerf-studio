<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>Kerf Studio — hole &amp; joint cutter for FDM printing</title>
</head>
<!-- h-svh, not the base layer's min-h-svh: the sidebar's intrinsic height would
     otherwise stretch the page past the viewport and take the canvas with it. -->
<body class="h-svh overflow-hidden">
<!-- The root must be a full-height flex column, or `main`'s flex-1 has no container to
     resolve against and the row collapses to the sidebar's content height. -->
<div id="root" class="flex h-full min-h-0 flex-col"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
