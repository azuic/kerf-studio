<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerf Studio — hole &amp; joint cutter for FDM printing</title>
</head>
<body>
<header>
  <h1>Kerf<span>&nbsp;Studio</span></h1>
  <div class="sub">holes · gaps · twist-locks · mating inserts — for FDM printing</div>
  <div class="badge">units: mm · plate ref: 256×256 (Bambu P1S)</div>
</header>

<div id="app">
  <div id="sidebar"></div>
  <div id="viewport">
    <div id="legend">
      <span><i style="background:#9AA3AA"></i>body</span>
      <span><i style="background:var(--cut)"></i>cutters</span>
      <span><i style="background:var(--insert)"></i>insert</span>
    </div>
    <div id="busy">computing boolean…</div>
    <div id="status"></div>
    <div id="hud">drag&nbsp;rotate · wheel&nbsp;zoom · shift/right-drag&nbsp;pan</div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
